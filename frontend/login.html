<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>물류센터 플랫폼 · 로그인</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <style>
    body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { width: 360px; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.1); }
    .login-logo { font-size: 1.5rem; font-weight: 700; color: #1a56db; }
  </style>
</head>
<body>
  <div class="card login-card p-4">
    <div class="text-center mb-4">
      <div class="login-logo">물류센터 플랫폼</div>
      <small class="text-muted">Logistics Data Platform</small>
    </div>

    <div id="error-msg" class="alert alert-danger d-none" role="alert"></div>

    <form id="login-form">
      <div class="mb-3">
        <label class="form-label fw-semibold">비밀번호</label>
        <input type="password" id="password" class="form-control" placeholder="비밀번호를 입력하세요" required autofocus />
      </div>
      <button type="submit" class="btn btn-primary w-100">로그인</button>
    </form>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("error-msg");
      errEl.classList.add("d-none");

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });

        if (!res.ok) {
          const data = await res.json();
          errEl.textContent = data.detail || "비밀번호가 올바르지 않습니다.";
          errEl.classList.remove("d-none");
          return;
        }

        const { access_token, role } = await res.json();
        localStorage.setItem("token", access_token);
        localStorage.setItem("role", role);
        window.location.href = "/index.html";
      } catch {
        errEl.textContent = "서버에 연결할 수 없습니다.";
        errEl.classList.remove("d-none");
      }
    });
  </script>
</body>
</html>
